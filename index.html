<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clinic Booking</title>
  <style>
    :root { --bg:#f5f7fa; --card:#fff; --text:#1c2430; --muted:#657083; --line:#dfe4ec; --brand:#0f766e; --brand-dark:#0b5a54; --bad:#b42318; --good:#067647; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
    main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    h2 { margin: 0 0 12px; font-size: 1.1rem; }
    .sub { color: var(--muted); margin: 0 0 20px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
    label { display:block; font-size:.85rem; color:var(--muted); margin-bottom:4px; }
    input, select { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:1rem; background:#fff; color:var(--text); }
    input:focus, select:focus { outline:2px solid var(--brand); outline-offset:1px; }
    .row { display:flex; gap:12px; flex-wrap:wrap; }
    .row > div { flex:1 1 200px; }
    button { padding:10px 16px; border:0; border-radius:8px; background:var(--brand); color:#fff; font-size:.95rem; font-weight:600; cursor:pointer; }
    button:hover { background:var(--brand-dark); }
    button:disabled { background:#b7c0cc; cursor:not-allowed; }
    button.secondary { background:#fff; color:var(--brand); border:1px solid var(--brand); }
    button.danger { background:#fff; color:var(--bad); border:1px solid var(--bad); }
    .slots { display:grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap:10px; }
    .slot { border:1px solid var(--line); border-radius:10px; padding:12px; display:flex; flex-direction:column; gap:6px; }
    .slot .who { font-weight:600; }
    .slot .when { color:var(--muted); font-size:.9rem; }
    .tag { font-size:.75rem; font-weight:600; padding:2px 8px; border-radius:99px; align-self:flex-start; }
    .tag.free { background:#d1fadf; color:var(--good); }
    .tag.taken { background:#fee4e2; color:var(--bad); }
    .tag.past { background:#eaecf0; color:var(--muted); }
    .msg { padding:10px 12px; border-radius:8px; margin-top:12px; font-size:.95rem; }
    .msg.error { background:#fee4e2; color:var(--bad); }
    .msg.ok { background:#d1fadf; color:var(--good); }
    .confirmation dl { display:grid; grid-template-columns: 110px 1fr; gap:6px 12px; margin:12px 0 0; }
    .confirmation dt { color:var(--muted); }
    .confirmation dd { margin:0; word-break:break-all; }
    .hidden { display:none; }
    .booking { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line); flex-wrap:wrap; }
    .booking:first-child { border-top:0; }
    .small { font-size:.85rem; color:var(--muted); }
  </style>
</head>
<body>
<main>
  <h1>Clinic Booking</h1>
  <p class="sub">Pick an available slot, enter your details, and get your confirmation.</p>

  <section class="card">
    <div class="row">
      <div>
        <label for="apiKey">API key</label>
        <input id="apiKey" type="password" placeholder="Paste your API key" autocomplete="off">
      </div>
      <div>
        <label for="provider">Provider</label>
        <select id="provider"><option value="">All providers</option></select>
      </div>
    </div>
    <div id="keyMsg"></div>
  </section>

  <section class="card">
    <h2>Slots</h2>
    <div id="slots" class="slots"></div>
    <div id="slotsMsg"></div>
  </section>

  <section id="bookCard" class="card hidden">
    <h2>Book this slot</h2>
    <p id="chosen" class="small"></p>
    <div class="row">
      <div><label for="name">Full name</label><input id="name" autocomplete="name"></div>
      <div><label for="email">Email</label><input id="email" type="email" autocomplete="email"></div>
    </div>
    <p style="margin:14px 0 0">
      <button id="confirmBtn">Confirm booking</button>
      <button id="cancelChoice" class="secondary" type="button">Back</button>
    </p>
    <div id="bookMsg"></div>
  </section>

  <section id="confirmCard" class="card confirmation hidden">
    <h2>Booking confirmed</h2>
    <dl id="confirmDetails"></dl>
  </section>

  <section class="card">
    <h2>My bookings</h2>
    <div class="row">
      <div><label for="lookupEmail">Your email</label><input id="lookupEmail" type="email"></div>
      <div style="align-self:flex-end"><button id="lookupBtn" class="secondary">Show my bookings</button></div>
    </div>
    <div id="myBookings"></div>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  let allSlots = [];
  let chosenSlot = null;
  let attemptKey = null; // one Idempotency-Key per booking attempt, so a double click can't book twice

  // The API key is typed once and remembered in this browser. ?key=... in the link also works.
  function loadKey() {
    const fromUrl = new URLSearchParams(location.search).get("key");
    try {
      if (fromUrl) localStorage.setItem("clinicApiKey", fromUrl);
      return fromUrl || localStorage.getItem("clinicApiKey") || "";
    } catch { return fromUrl || ""; }
  }
  function saveKey(value) { try { localStorage.setItem("clinicApiKey", value); } catch {} }

  async function api(path, options = {}) {
    const res = await fetch(path, {
      ...options,
      headers: { "Content-Type": "application/json", "X-API-Key": $("apiKey").value.trim(), ...(options.headers || {}) },
    });
    let data = null;
    try { data = await res.json(); } catch {}
    return { status: res.status, ok: res.ok, data, retryAfter: res.headers.get("Retry-After") };
  }

  function show(id, text, kind) {
    $(id).innerHTML = text ? `<div class="msg ${kind}"></div>` : "";
    if (text) $(id).firstChild.textContent = text;
  }
  function errorText(r) {
    if (r.status === 401) return "That API key was not accepted. Check it and try again.";
    if (r.status === 429) return `Too many attempts for this email. Try again in ${r.retryAfter || "a few"} seconds.`;
    return (r.data && r.data.error) || "Something went wrong. Please try again.";
  }
  const when = (iso) => new Date(iso).toLocaleString([], { weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" });

  async function loadSlots() {
    show("slotsMsg", "", "");
    if (!$("apiKey").value.trim()) { $("slots").innerHTML = ""; show("keyMsg", "Enter your API key to load slots.", "error"); return; }
    const provider = $("provider").value;
    const r = await api("/slots" + (provider ? "?provider=" + encodeURIComponent(provider) : ""));
    if (!r.ok) { $("slots").innerHTML = ""; show("keyMsg", errorText(r), "error"); return; }
    show("keyMsg", "", "");
    allSlots = r.data.slots;

    if (!provider) { // fill the provider list once, from the full list
      const names = [...new Set(allSlots.map((s) => s.provider))];
      $("provider").innerHTML = '<option value="">All providers</option>' + names.map((n) => `<option>${n.replace(/</g, "&lt;")}</option>`).join("");
    }
    renderSlots();
  }

  function renderSlots() {
    const box = $("slots");
    box.innerHTML = "";
    if (allSlots.length === 0) { show("slotsMsg", "No slots to show.", "error"); return; }
    for (const s of allSlots) {
      const started = new Date(s.start).getTime() <= Date.now();
      const state = !s.available ? "taken" : started ? "past" : "free";
      const el = document.createElement("div");
      el.className = "slot";
      const label = { free: "Available", taken: "Booked", past: "Already started" }[state];
      el.innerHTML = '<div class="who"></div><div class="when"></div><span class="tag ' + state + '">' + label + "</span>";
      el.querySelector(".who").textContent = s.provider;
      el.querySelector(".when").textContent = when(s.start) + " – " + new Date(s.end).toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" });
      const btn = document.createElement("button");
      btn.textContent = "Book";
      btn.disabled = state !== "free";
      btn.onclick = () => chooseSlot(s);
      el.appendChild(btn);
      box.appendChild(el);
    }
  }

  function chooseSlot(slot) {
    chosenSlot = slot;
    attemptKey = crypto.randomUUID();
    $("chosen").textContent = `${slot.provider} · ${when(slot.start)}`;
    $("bookCard").classList.remove("hidden");
    $("confirmCard").classList.add("hidden");
    show("bookMsg", "", "");
    $("name").focus();
    $("bookCard").scrollIntoView({ behavior: "smooth", block: "center" });
  }

  $("cancelChoice").onclick = () => { chosenSlot = null; $("bookCard").classList.add("hidden"); };

  $("confirmBtn").onclick = async () => {
    const name = $("name").value.trim(), email = $("email").value.trim();
    if (!name || !email) return show("bookMsg", "Please enter your name and email.", "error");
    $("confirmBtn").disabled = true;
    const r = await api("/bookings", {
      method: "POST",
      headers: { "Idempotency-Key": attemptKey },
      body: JSON.stringify({ slot_id: chosenSlot.id, name, email }),
    });
    $("confirmBtn").disabled = false;
    if (!r.ok) { show("bookMsg", errorText(r), "error"); if (r.status === 409) loadSlots(); return; }

    const b = r.data;
    $("confirmDetails").innerHTML = "<dt>Booking ID</dt><dd></dd><dt>Provider</dt><dd></dd><dt>Time</dt><dd></dd><dt>Name</dt><dd></dd><dt>Email</dt><dd></dd><dt>Status</dt><dd></dd>";
    const cells = $("confirmDetails").querySelectorAll("dd");
    [b.id, chosenSlot.provider, when(chosenSlot.start), b.name, b.email, b.status].forEach((v, i) => (cells[i].textContent = v));
    $("confirmCard").classList.remove("hidden");
    $("bookCard").classList.add("hidden");
    $("lookupEmail").value = b.email;
    $("confirmCard").scrollIntoView({ behavior: "smooth", block: "center" });
    loadSlots();
    loadMyBookings();
  };

  async function loadMyBookings() {
    const email = $("lookupEmail").value.trim();
    const box = $("myBookings");
    if (!email) { box.innerHTML = ""; return; }
    const r = await api("/bookings?email=" + encodeURIComponent(email) + "&limit=50");
    if (!r.ok) { show("myBookings", errorText(r), "error"); return; }
    box.innerHTML = "";
    if (r.data.bookings.length === 0) { box.innerHTML = '<p class="small">No bookings found for that email.</p>'; return; }
    for (const b of r.data.bookings) {
      const slot = allSlots.find((s) => s.id === b.slot_id);
      const row = document.createElement("div");
      row.className = "booking";
      const info = document.createElement("div");
      info.innerHTML = "<strong></strong><div class='small'></div>";
      info.querySelector("strong").textContent = slot ? `${slot.provider} · ${when(slot.start)}` : b.slot_id;
      info.querySelector(".small").textContent = `${b.status} · ${b.id}`;
      row.appendChild(info);
      if (b.status === "confirmed") {
        const btn = document.createElement("button");
        btn.className = "danger"; btn.textContent = "Cancel";
        btn.onclick = async () => { btn.disabled = true; await api("/bookings/" + b.id, { method: "DELETE" }); loadSlots().then(loadMyBookings); };
        row.appendChild(btn);
      }
      box.appendChild(row);
    }
  }

  $("lookupBtn").onclick = loadMyBookings;
  $("provider").onchange = loadSlots;
  $("apiKey").onchange = () => { saveKey($("apiKey").value.trim()); loadSlots(); };

  $("apiKey").value = loadKey();
  loadSlots();
</script>
</body>
</html>
